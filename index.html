<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10182b">
  <meta name="description" content="하루에 한 번, 누구나 한 번쯤 고민해 봤을 선택. 내가 고른 쪽의 결과와 고르지 않은 쪽의 결과까지 보는 2분짜리 이야기.">
  <title>와디프 · 오늘의 갈림길</title>
  <link rel="icon" type="image/webp" href="./img/stego-icon.webp">
  <link rel="preload" as="image" href="./img/stego-body.webp">
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js" defer></script>
  <script src="./stories.js" defer></script>
  <script src="./seasons.js" defer></script>
  <script src="./art.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img src="./img/stego-icon.webp" alt="" width="45" height="45"><span>와디프 <small>WADIF</small></span></div>
      <div class="day-tag" id="dayTag">오늘의 이야기</div>
    </header>

    <main id="app" class="game" aria-live="polite">
      <div class="scene" id="scene" aria-hidden="true">
        <div class="sky-glow"></div>
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="far-tower tower-left"></div>
        <div class="far-tower tower-right"></div>
        <div class="platform platform-left"></div>
        <div class="platform platform-right"></div>
        <div class="bridge"></div>
        <div class="world-symbol" id="worldSymbol">✉</div>
        <div class="portal portal-left"><span></span></div>
        <div class="portal portal-right"><span></span></div>
        <div class="hallway-art">
          <div class="hallway-back"></div>
          <div class="hallway-door"><span class="door-handle"></span></div>
          <div class="hallway-floor"></div>
          <div class="hallway-parcel"><span class="parcel-lid"></span><span class="parcel-tape"></span></div>
        </div>
        <div class="scene-shadow"></div>
      </div>

      <!-- StegoAhnna's stage. After a choice, the right and left pedestals hold
           the day as chosen and the day as it would have gone; the token between
           them is the hidden condition, the same for both. -->
      <div class="stage" id="stage" aria-hidden="true">
        <div class="pedestal ped-left"></div>
        <div class="pedestal ped-center"></div>
        <div class="pedestal ped-right"></div>
        <div class="stage-link"></div>
        <div class="token" id="stageToken"><span class="token-icon" id="tokenIcon"></span><span class="token-label" id="tokenLabel"></span></div>
        <div class="actor at-center" id="actorMain">
          <p class="actor-label" id="labelMain"></p>
          <div class="actor-art"><img src="./img/stego-body.webp" alt="" width="400" height="304"><svg class="face" id="faceMain" viewBox="0 0 560 425"></svg><span class="actor-prop" id="propMain"></span></div>
        </div>
        <div class="actor at-right is-hidden" id="actorTwin">
          <p class="actor-label" id="labelTwin"></p>
          <div class="actor-art"><img src="./img/stego-body.webp" alt="" width="400" height="304"><svg class="face" id="faceTwin" viewBox="0 0 560 425"></svg><span class="actor-prop" id="propTwin"></span></div>
        </div>
      </div>

      <section class="story-panel" id="storyPanel">
        <p class="eyebrow" id="eyebrow">A tiny what-if, once a day</p>
        <h1 id="title">오늘의 갈림길</h1>
        <p id="storyText">평범한 하루, 두 갈래 선택. 고르고 나면 다른 쪽을 골랐을 때의 이야기도 볼 수 있어요.</p>
        <div class="actions" id="actions"><button class="primary-button" id="startButton" type="button">오늘의 이야기 시작하기 <span aria-hidden="true">↗</span></button></div>
        <p class="quiet-note" id="quietNote">약 2분 · 선택은 하루에 한 번</p>
      </section>
    </main>

    <footer class="footer"><span>작은 선택, 조금 낯선 결과</span><span>Made for curious minds <span aria-hidden="true">✦</span></span></footer>
  </div>
</body>
</html>
